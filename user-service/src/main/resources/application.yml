spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# gRPC Server listens on port 9090
grpc:
  server:
    port: 9090

# Spring Boot HTTP (actuator/health) on port 8080
server:
  port: 8080

logging:
  level:
    com.example.grpc: DEBUG
    io.grpc: INFO
